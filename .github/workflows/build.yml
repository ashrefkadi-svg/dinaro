name: DINARO+ build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/algeria-finance-intelligence
      - feature/complete-financial-platform
  pull_request:
    branches:
      - main
      - feature/algeria-finance-intelligence
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build

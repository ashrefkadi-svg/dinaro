name: DINARO verification
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test design preferences
        run: npm run test
      - name: Verify local SQLite ledger and authentication API
        run: npm run test:api
      - name: Typecheck and production build
        run: npm run build
